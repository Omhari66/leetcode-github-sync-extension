<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>LeetCode → GitHub Sync</h1>

  <label>GitHub Personal Access Token</label>
  <input type="password" id="pat" placeholder="ghp_..." />
  <p class="hint">
    Create one at github.com → Settings → Developer settings → Personal
    access tokens (fine-grained). Give it <b>Contents: Read & write</b> on
    just the repo you'll use.
  </p>

  <label>GitHub Username</label>
  <input type="text" id="owner" placeholder="e.g. omhari66" />

  <label>Repository Name</label>
  <input type="text" id="repo" placeholder="e.g. leetcode-solutions" />

  <label class="checkbox-row">
    <input type="checkbox" id="autoCreateRepo" checked />
    Create this repo automatically if it doesn't exist
  </label>

  <button id="save" class="btn-primary">Save Settings</button>
  <button id="test" class="btn-ghost">Test Connection</button>
  <div id="settingsStatus" class="status"></div>

  <hr />

  <button id="manualSync" class="btn-primary">Sync Current Problem Now</button>
  <p class="hint">Use this on a LeetCode problem tab if auto-detect misses a submission.</p>

  <div id="lastSync" class="last-sync"></div>

  <script src="popup.js"></script>
</body>
</html>
